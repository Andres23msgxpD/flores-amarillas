<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Para ti 🌻</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #bgCanvas { z-index: 1; }
    #flowerCanvas { z-index: 2; }
    #fxCanvas { z-index: 3; }
    #start-screen {
      position: absolute; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: opacity 0.5s ease;
      touch-action: manipulation;
    }
    .hud-box {
      width: 170px; height: 170px;
      border: 1px dashed rgba(255, 215, 0, 0.4);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
      border-radius: 12px;
      pointer-events: auto;
    }
    .hud-box::before, .hud-box::after {
      content: ''; position: absolute; width: 16px; height: 16px;
      border-color: #ffd700; border-style: solid;
    }
    .hud-box::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
    .hud-box::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }
    .icon { font-size: 38px; animation: pulse 1.8s infinite alternate; }
    .start-text {
      color: #ffd700; margin-top: 14px; font-size: 13px; letter-spacing: 4px;
      font-weight: 600; text-transform: uppercase; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #ffd700); }
    }
  </style>
</head>
<body>
  <audio id="bgm" preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div id="start-screen">
    <div class="hud-box">
      <div class="icon">🌻</div>
      <div class="start-text">TOCA AQUÍ</div>
    </div>
  </div>

  <canvas id="bgCanvas"></canvas>
  <canvas id="flowerCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>

  <script>
    const bgCanvas = document.getElementById("bgCanvas");
    const flowerCanvas = document.getElementById("flowerCanvas");
    const fxCanvas = document.getElementById("fxCanvas");
    const bgCtx = bgCanvas.getContext("2d");
    const flCtx = flowerCanvas.getContext("2d");
    const fxCtx = fxCanvas.getContext("2d");
    const bgm = document.getElementById("bgm");
    let width, height;

    function resize() {
      width = bgCanvas.width = flowerCanvas.width = fxCanvas.width = window.innerWidth;
      height = bgCanvas.height = flowerCanvas.height = fxCanvas.height = window.innerHeight;
      bgCtx.fillStyle = "#050508";
      bgCtx.fillRect(0, 0, width, height);
    }
    window.addEventListener("resize", resize);
    resize();

    let started = false;
    let progress = 0;
    const points = [];

    function generateSunflowerPoints() {
      const cx = width / 2;
      const cy = height / 2 - 30;
      const scale = Math.min(width, height) * 0.35;
      for (let t = 0; t <= 1; t += 0.006) {
        let x = cx + Math.sin(t * Math.PI) * 20;
        let y = cy + scale * 0.4 + t * (height * 0.42);
        points.push({ x, y, color: '#39ff14', r: 1.8 });
      }
      for (let a = 0; a <= Math.PI * 2; a += 0.06) {
        let lx = cx + 15 + Math.cos(a) * 45;
        let ly = cy + scale * 0.8 + Math.sin(a) * 18;
        points.push({ x: lx, y: ly, color: '#00ff66', r: 1.5 });
      }
      const petals = 16;
      for (let a = 0; a < Math.PI * 2; a += 0.008) {
        let r = scale * (0.65 + 0.38 * Math.cos(petals * a));
        points.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a), color: '#ffea00', r: 2.2 });
      }
      for (let a = 0; a < Math.PI * 2; a += 0.012) {
        let r = (scale * 0.72) * (0.65 + 0.38 * Math.cos(petals * a + 0.2));
        points.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a), color: '#ffa500', r: 1.8 });
      }
      const phi = 1.61803398875;
      const totalSeeds = 280;
      for (let i = 0; i < totalSeeds; i++) {
        let angle = i * 2 * Math.PI * phi;
        let rad = Math.sqrt(i) / Math.sqrt(totalSeeds) * (scale * 0.38);
        points.push({ x: cx + rad * Math.cos(angle), y: cy + rad * Math.sin(angle), color: '#ff9900', r: 1.6 });
      }
    }

    const sparkles = Array.from({ length: 45 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vy: -0.3 - Math.random() * 0.5,
      size: 1 + Math.random() * 1.5,
      alpha: 0.2 + Math.random() * 0.6
    }));

    function loop() {
      bgCtx.fillStyle = "rgba(5, 5, 8, 0.25)";
      bgCtx.fillRect(0, 0, width, height);
      for (let i = 0; i < sparkles.length; i++) {
        const p = sparkles[i];
        p.y += p.vy;
        if (p.y < 0) p.y = height;
        bgCtx.fillStyle = \`rgba(255, 230, 100, ${p.alpha})\`;
        bgCtx.fillRect(p.x, p.y, p.size, p.size);
      }
      if (started) {
        fxCtx.clearRect(0, 0, width, height);
        if (progress < points.length) {
          const batch = 12;
          const limit = Math.min(progress + batch, points.length);
          for (let i = progress; i < limit; i++) {
            const pt = points[i];
            flCtx.fillStyle = pt.color;
            flCtx.beginPath();
            flCtx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            flCtx.fill();
          }
          const head = points[limit - 1];
          fxCtx.fillStyle = '#ffffff';
          fxCtx.beginPath();
          fxCtx.arc(head.x, head.y, 4, 0, Math.PI * 2);
          fxCtx.fill();
          progress = limit;
        }
      }
      requestAnimationFrame(loop);
    }

    function startExperience(e) {
      if (e) e.preventDefault();
      if (started) return;
      started = true;

      if (bgm) {
        bgm.currentTime = 0;
        bgm.play().catch(err => console.error(err));
      }

      const scr = document.getElementById("start-screen");
      scr.style.opacity = "0";
      setTimeout(() => { scr.style.display = "none"; }, 500);

      generateSunflowerPoints();
    }

    const startBtn = document.getElementById("start-screen");
    startBtn.addEventListener("click", startExperience);
    startBtn.addEventListener("touchstart", startExperience, { passive: false });

    loop();
  </script>
</body>
</html>
