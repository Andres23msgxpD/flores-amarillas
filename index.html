<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Para ti 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #start-screen {
      position: absolute;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    .hud-box {
      width: 180px;
      height: 180px;
      border: 1px dashed rgba(255, 215, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
      border-radius: 12px;
    }
    .hud-box::before, .hud-box::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: #ffd700;
      border-style: solid;
    }
    .hud-box::before {
      top: -2px; left: -2px;
      border-width: 2px 0 0 2px;
    }
    .hud-box::after {
      bottom: -2px; right: -2px;
      border-width: 0 2px 2px 0;
    }
    .icon {
      font-size: 40px;
      filter: drop-shadow(0 0 10px #ffd700);
      animation: pulse 1.8s infinite alternate;
    }
    .start-text {
      color: #ffd700;
      margin-top: 15px;
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 600;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
    }
    #center-message {
      position: absolute;
      z-index: 5;
      text-align: center;
      color: #fff;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    #center-message h1 {
      font-size: 2.2rem;
      letter-spacing: 5px;
      color: #fffbdf;
      text-shadow: 0 0 10px #ffd700, 0 0 25px #ffaa00, 0 0 45px #ff8800;
      margin-bottom: 8px;
    }
    #center-message p {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #ffe680;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 18px #ffd700); }
    }
  </style>
</head>
<body>

  <!-- Audio online directo -->
  <audio id="bgm" preload="auto">
    <source src="https://raw.githubusercontent.com/Lyg0327/Music/main/golden-hour.mp3" type="audio/mpeg">
  </audio>

  <div id="start-screen" onclick="startExperience()">
    <div class="hud-box">
      <div class="icon">🌻</div>
      <div class="start-text">TOCA AQUÍ</div>
    </div>
  </div>

  <div id="center-message">
    <h1>FLORES AMARILLAS</h1>
    <p>Para ti en este día especial</p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const bgm = document.getElementById("bgm");
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let started = false;
    let progress = 0;
    const points = [];

    function generateSunflowerPoints() {
      const centerX = width / 2;
      const centerY = height / 2 - 30;
      const baseScale = Math.min(width, height) * 0.35;

      // Tallo y hoja
      for (let t = 0; t <= 1; t += 0.005) {
        let x = centerX + Math.sin(t * Math.PI) * 20;
        let y = centerY + baseScale * 0.4 + t * (height * 0.45);
        points.push({ x, y, color: '#39ff14', size: 1.8 });
      }

      for (let a = 0; a <= Math.PI * 2; a += 0.04) {
        let lx = centerX + 15 + Math.cos(a) * 45;
        let ly = centerY + baseScale * 0.8 + Math.sin(a) * 18;
        points.push({ x: lx, y: ly, color: '#00ff66', size: 1.5 });
      }

      // Pétalos
      const numPetals = 16;
      for (let a = 0; a < Math.PI * 2; a += 0.005) {
        let r = baseScale * (0.65 + 0.38 * Math.cos(numPetals * a));
        let x = centerX + r * Math.cos(a);
        let y = centerY + r * Math.sin(a);
        points.push({ x, y, color: '#ffea00', size: 2.2 });
      }

      for (let a = 0; a < Math.PI * 2; a += 0.008) {
        let r = (baseScale * 0.72) * (0.65 + 0.38 * Math.cos(numPetals * a + 0.2));
        let x = centerX + r * Math.cos(a);
        let y = centerY + r * Math.sin(a);
        points.push({ x, y, color: '#ffa500', size: 1.8 });
      }

      // Centro / Semillas
      const phi = 1.61803398875;
      const totalSeeds = 350;
      for (let i = 0; i < totalSeeds; i++) {
        let angle = i * 2 * Math.PI * phi;
        let radius = Math.sqrt(i) / Math.sqrt(totalSeeds) * (baseScale * 0.38);
        let x = centerX + radius * Math.cos(angle);
        let y = centerY + radius * Math.sin(angle);
        points.push({ x, y, color: '#ff9900', size: 1.6 });
      }
    }

    const sparkles = [];
    for (let i = 0; i < 60; i++) {
      sparkles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vy: -0.2 - Math.random() * 0.6,
        size: Math.random() * 2,
        alpha: Math.random()
      });
    }

    function drawSparkles() {
      sparkles.forEach(p => {
        p.y += p.vy;
        if (p.y < 0) p.y = height;
        ctx.fillStyle = `rgba(255, 230, 100, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function animate() {
      ctx.fillStyle = "rgba(5, 5, 8, 0.15)";
      ctx.fillRect(0, 0, width, height);

      drawSparkles();

      if (started) {
        const step = Math.min(progress, points.length);

        for (let i = 0; i < step; i++) {
          const pt = points[i];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          ctx.fillStyle = pt.color;
          ctx.shadowColor = pt.color;
          ctx.shadowBlur = 12;
          ctx.fill();
        }

        if (step < points.length) {
          const head = points[step];
          ctx.beginPath();
          ctx.arc(head.x, head.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffaa';
          ctx.shadowBlur = 20;
          ctx.fill();
          
          progress += 7;
        } else {
          const msg = document.getElementById("center-message");
          msg.style.opacity = "1";
          msg.style.transform = "scale(1)";
        }
      }

      requestAnimationFrame(animate);
    }

    function startExperience() {
      if (bgm) {
        bgm.currentTime = 0;
        bgm.play().catch(e => console.log("Audio waiting for user gesture:", e));
      }

      document.getElementById("start-screen").style.opacity = "0";
      setTimeout(() => {
        document.getElementById("start-screen").style.display = "none";
      }, 800);

      generateSunflowerPoints();
      started = true;
    }

    animate();
  </script>
</body>
</html>
